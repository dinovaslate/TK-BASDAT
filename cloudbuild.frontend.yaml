substitutions:
  _IMAGE: asia-southeast2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/tk-basdat-aeromiles:latest
  _REACT_APP_API_BASE_URL: ''

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - REACT_APP_API_BASE_URL=${_REACT_APP_API_BASE_URL}
      - -t
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}
